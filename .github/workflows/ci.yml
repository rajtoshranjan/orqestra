name: CI

on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  server-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.21"
      - name: Install dependencies
        working-directory: ./server
        run: uv sync --frozen --group dev
      - name: Run pre-commit
        run: server/.venv/bin/pre-commit run --all-files
      - name: Run tests
        run: |
          cp .env.template .env
          docker compose run --rm server python manage.py test

  client-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: ./client
        run: npm ci
      - name: Run lint
        working-directory: ./client
        run: npm run lint
      - name: Run test
        working-directory: ./client
        run: npm run test
      - name: Run build
        working-directory: ./client
        run: npm run build
