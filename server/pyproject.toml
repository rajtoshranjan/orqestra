[project]
name = "orqestra-server"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django==5.1.4",
    "djangorestframework==3.15.2",
    "django-cors-headers==4.6.0",
    "django-filter==24.3",
    "uvicorn[standard]==0.27.1",
    "djangorestframework-simplejwt==5.4.0",
    "channels==4.2.0",
    "channels-redis==4.2.1",
    "daphne==4.1.2",
    "redis>=5.0.0,<5.1.0",

    # DB
    "psycopg==3.2.4",
    "psycopg-binary==3.2.4",
    "psycopg-pool==3.2.4",

    # HTTP
    "requests==2.32.3",

    # Security / Encryption
    "cryptography==42.0.5",

    # Agent / LLM
    "anthropic==0.42.0",
    "google-genai==0.8.0",
]

[dependency-groups]
dev = ["pre-commit"]

[tool.uv]
package = false

[tool.black]
line-length = 88
include = '\.pyi?$'
exclude = '''
/(
	\.git
| \.hg
| \.mypy_cache
| \.tox
| \.venv
| _build
| buck-out
| build
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
